name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: npm run check

      - name: Data invariants
        # explicit file path: `node --test tests/` breaks on Node 22 (it tries to
        # load the directory as a module: "Cannot find module .../ui/tests")
        run: npm test

      - name: Render equivalence + boot checks
        run: node scripts/verify-render.mjs

      # The scorecard from ui/QUALITY.md, enforced. A11y, console errors, external
      # requests, overflow and payload size all fail the build if they regress.
      - name: Quality scorecard (strict)
        run: node scripts/audit.mjs --strict
